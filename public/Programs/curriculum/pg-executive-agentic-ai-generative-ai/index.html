<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative AI &amp; Agentic AI Program — Curriculum</title>
<style>
  :root{
    --bg:#0c0916; --bg-card:#15101f; --bg-card-2:#17131f; --border:#2a2338;
    --text:#f2eef8; --text-dim:#a89fb8;
    --pink:#ec3d84; --orange:#f9a13a; --yellow:#ffd23f; --green:#35d6a3; --blue:#2f8cf0; --purple:#9b4de0;
    --rainbow:linear-gradient(90deg,#ec3d84,#f9a13a,#ffd23f,#35d6a3,#2f8cf0,#9b4de0);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif;line-height:1.6;}
  .wrap{max-width:980px;margin:0 auto;padding:0 32px;}
  header.top{position:sticky;top:0;z-index:50;background:rgba(12,9,22,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;max-width:980px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;}
  .brand img{height:32px;width:32px;object-fit:contain;}
  .brand .a{background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;}
  nav.top-nav{display:flex;gap:20px;font-size:.82rem;color:var(--text-dim);}
  nav.top-nav a{color:var(--text-dim);text-decoration:none;}
  nav.top-nav a:hover{color:var(--text);}
  .rule{height:4px;border:none;background:var(--rainbow);border-radius:4px;margin:18px 0 30px;width:140px;}
  h1.big-title{font-size:3.6rem;letter-spacing:.02em;margin:40px 0 4px;font-weight:900;line-height:1.05;}
  h1{font-size:2.7rem;margin:36px 0 8px;font-weight:800;}
  h1 .grad{background:linear-gradient(90deg,var(--pink),var(--orange),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--text-dim);font-size:1.15rem;max-width:760px;margin-bottom:34px;}
  h2{font-size:1.9rem;margin:48px 0 6px;font-weight:800;border-top:1px solid var(--border);padding-top:36px;}
  h2 .grad{background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;}
  h2:first-of-type{border-top:none;padding-top:0;}
  h3{font-size:1.35rem;margin:30px 0 6px;color:var(--text);}
  h3 .eyebrow-inline{color:var(--orange);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-left:8px;}
  h4{font-size:1.1rem;margin:18px 0 6px;color:var(--blue);}
  p.mdesc{color:var(--text-dim);font-size:1.02rem;margin:2px 0 12px;}
  ul{margin:0 0 16px;padding-left:22px;font-size:1.05rem;color:var(--text-dim);}
  ul li{margin-bottom:7px;}
  ul li b, ul li strong{color:var(--text);}

  table.outline{width:100%;border-collapse:collapse;margin:22px 0 12px;font-size:1.02rem;border:1px solid var(--border);}
  table.outline th{text-align:left;color:var(--orange);text-transform:uppercase;font-size:.82rem;letter-spacing:.08em;border:1px solid var(--border);padding:14px 16px;background:var(--bg-card-2);}
  table.outline td{padding:14px 16px;border:1px solid var(--border);color:var(--text-dim);vertical-align:top;}
  table.outline tr td:first-child{color:var(--text);font-weight:700;}
  table.outline tr:nth-child(even) td{background:rgba(255,255,255,0.02);}

  .proj-line{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:10px;font-size:.85rem;}
  .proj-line span.k{color:var(--pink);font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;}
  .proj-line span.k2{color:var(--yellow);}

  .toolchip{display:inline-block;border:1px solid var(--border);border-radius:8px;padding:5px 14px;font-size:.95rem;color:var(--text-dim);margin:3px 5px 3px 0;background:var(--bg-card-2);}

  footer{padding:50px 0 40px;text-align:center;color:var(--text-dim);font-size:.8rem;}
  footer .flogo{height:26px;vertical-align:middle;margin-right:8px;}
  .cta{display:inline-block;margin-top:18px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:999px;font-size:.9rem;}
</style>
</head>
<body>

<header class="top">
  <div class="topbar">
    <nav class="top-nav">

      <a href="#deepdive">Deep Dive</a>
      <a href="#electives">Electives</a>
      <a href="#tools">Tools</a>
    </nav>
  </div>
</header>
